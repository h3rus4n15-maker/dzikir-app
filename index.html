    <!-- AUDIO ELEMENT & WEB AUDIO CONTEXT BACKUP -->
    <script>
        // Web Audio API click sound generator
        let audioCtx = null;
        let isSoundEnabled = true;

        function playClickSound() {
            if (!isSoundEnabled) return;
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.08);
                
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch (e) {
                console.log("Web Audio API not allowed yet.");
            }
        }

        function playSuccessSound() {
            if (!isSoundEnabled) return;
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc1 = audioCtx.createOscillator();
                const osc2 = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                osc1.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);

                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(659.25, audioCtx.currentTime);
                osc2.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.1);
                
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                
                osc1.connect(gain);
                osc2.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc1.start();
                osc2.start();
                osc1.stop(audioCtx.currentTime + 0.25);
                osc2.stop(audioCtx.currentTime + 0.25);
            } catch (e) {
                console.log("Web Audio API fail.");
            }
        }
    </script>

    <!-- LOGIKA APLIKASI -->
    <script>
        // APP STATE
        let activeTab = 'pagi';
        let counts = {};
        let settings = {
            darkMode: false,
            fontSize: 28,
            showLatin: true,
            showTranslation: true,
            showBenefit: true,
            autoScroll: true

        let currentPlayingId = null;

        // DOM ELEMENTS
        const dhikrListEl = document.getElementById('dhikr-list');
        const tabPagiBtn = document.getElementById('tab-pagi');
        const tabPetangBtn = document.getElementById('tab-petang');
        
        const btnReset = document.getElementById('btn-reset');
        const btnSound = document.getElementById('btn-sound');
        const btnSettings = document.getElementById('btn-settings');
        const btnCloseSettings = document.getElementById('btn-close-settings');
        
        const settingsDrawer = document.getElementById('settings-drawer');
        const settingsContent = document.getElementById('settings-content');
        
        const btnThemeToggle = document.getElementById('btn-theme-toggle');
        const themeIconText = document.getElementById('theme-icon-text');
        
        const inputFontSize = document.getElementById('input-font-size');
        const fontSizeLabel = document.getElementById('font-size-label');
        
        const toggleLatin = document.getElementById('toggle-latin');
        const toggleTranslation = document.getElementById('toggle-translation');
        const toggleBenefit = document.getElementById('toggle-benefit');
        const toggleAutoScroll = document.getElementById('toggle-autoscroll');
        
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const progressPercent = document.getElementById('progress-percent');
        
        const appTitle = document.getElementById('app-title');
        const timeIcon = document.getElementById('time-icon');
        
        const soundIconOn = document.getElementById('sound-icon-on');
        const soundIconOff = document.getElementById('sound-icon-off');
        
        const globalAudioPlayer = document.getElementById('global-audio-player');

        // INIALIZATION
        window.addEventListener('DOMContentLoaded', () => {
            loadSettings();
            detectTimeCategory();
            loadProgress();
            renderDhikrList();
            updateProgressBar();
            setupEventListeners();
            setupAudioEngine();
        });

        // Detect current time to set default tab
        function detectTimeCategory() {
            const hour = new Date().getHours();
            if (hour >= 4 && hour < 12) {
                switchTab('pagi');
            } else {
                switchTab('petang');
            }
        }

        // Switch active tab
        function switchTab(tab) {
            // Stop audio when switching tabs
            stopAudio();
            
            activeTab = tab;
            if (tab === 'pagi') {
                tabPagiBtn.className = "flex-1 flex items-center justify-center space-x-2 py-2.5 rounded-lg text-sm font-medium transition-all duration-200 bg-white dark:bg-slate-700 text-emerald-600 dark:text-emerald-300 shadow-sm";
                tabPetangBtn.className = "flex-1 flex items-center justify-center space-x-2 py-2.5 rounded-lg text-sm font-medium transition-all duration-200 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white";
                appTitle.innerText = "Dzikir Pagi";
                timeIcon.innerText = "☀️";
            } else {
                tabPetangBtn.className = "flex-1 flex items-center justify-center space-x-2 py-2.5 rounded-lg text-sm font-medium transition-all duration-200 bg-white dark:bg-slate-700 text-emerald-600 dark:text-emerald-300 shadow-sm";
                tabPagiBtn.className = "flex-1 flex items-center justify-center space-x-2 py-2.5 rounded-lg text-sm font-medium transition-all duration-200 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white";
                appTitle.innerText = "Dzikir Petang";
                timeIcon.innerText = "🌙";
            }
            renderDhikrList();
            updateProgressBar();
        }

        // Get active dataset
        function getActiveData() {
            return activeTab === 'pagi' ? dataDzikirPagi : dataDzikirPetang;
        }

        // Render cards
        function renderDhikrList() {
            dhikrListEl.innerHTML = '';
            const data = getActiveData();

            data.forEach((dzikir, index) => {
                const currentVal = counts[dzikir.id] || 0;
                const isCompleted = currentVal >= dzikir.target;
                const isAudioPlaying = currentPlayingId === dzikir.id && !globalAudioPlayer.paused;
                
                const card = document.createElement('div');
                card.id = `card-${dzikir.id}`;

                    isCompleted ? 'border-emerald-200 dark:border-emerald-900/60 bg-emerald-50/20 dark:bg-emerald-950/10' : ''
                } ${isAudioPlaying ? 'active-audio-ring' : ''}`;
                
                // Content construction
                let html = `
                    <!-- Header Kartu -->

                        <div class="flex items-center space-x-2">

                            <h2 class="font-semibold text-slate-900 dark:text-white text-sm md:text-base">${dzikir.title}</h2>
                        </div>
                        <div class="flex items-center space-x-2">
                            <!-- Play Audio Button -->
                            <button onclick="${dzikir.audio ? `handleAudioPlay('${dzikir.id}', '${dzikir.audio}')` : ''}" class="p-1.5 rounded-full text-slate-400 ${dzikir.audio ? 'hover:text-emerald-500 dark:hover:text-emerald-400 hover:bg-slate-50 dark:hover:bg-slate-700' : 'opacity-40 cursor-not-allowed'} transition" title="${dzikir.audio ? 'Putar Suara' : 'Audio belum tersedia'}" ${dzikir.audio ? '' : 'disabled'}>
                                <span id="audio-btn-icon-${dzikir.id}">
                                    ${isAudioPlaying 
                                        ? '<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-emerald-500" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" /></svg>' 
                                        : '<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>'
                                    }
                                </span>
                            </button>
                            <span class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider">${dzikir.target}x Baca</span>

                    </div>

                    <!-- Teks Arab -->
                    <div class="arabic-text text-slate-950 dark:text-slate-100 leading-relaxed mb-4 select-all text-right pt-2" style="font-size: ${settings.fontSize}px;">
                        ${dzikir.arabic.replace(/\n/g, '<br>')}
                    </div>

                    <!-- Teks Latin -->
                    <p class="latin-text text-sm italic text-emerald-700 dark:text-emerald-300 leading-relaxed mb-3 ${settings.showLatin ? '' : 'hidden'}">
                        ${dzikir.latin}
                    </p>

                    <!-- Terjemahan -->
                    <div class="translation-text text-sm text-slate-600 dark:text-slate-300 leading-relaxed mb-4 pl-3 border-l-2 border-slate-200 dark:border-slate-700 ${settings.showTranslation ? '' : 'hidden'}">
                        <span class="font-medium text-xs text-slate-400 block mb-0.5">Artinya:</span>
                        ${dzikir.translation}
                    </div>

                    <!-- Faedah/Hadits -->
                    <div class="benefit-box bg-slate-50 dark:bg-slate-800/40 rounded-xl p-3.5 border border-slate-100 dark:border-slate-700/30 text-xs text-slate-500 dark:text-slate-400 flex items-start space-x-2 mb-4 ${settings.showBenefit ? '' : 'hidden'}">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-amber-500 flex-shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                        </svg>
                        <div>
                            <span class="font-bold text-slate-700 dark:text-slate-300">Faedah:</span> ${dzikir.benefit}
                        </div>
                    </div>

                    <!-- Bagian Counter -->
                    <div class="mt-auto flex items-center justify-between border-t border-slate-100 dark:border-slate-700/50 pt-4">
                        <div class="text-xs text-slate-400 dark:text-slate-500">
                            Terbaca: <span class="font-bold text-slate-700 dark:text-slate-200 text-sm" id="count-val-${dzikir.id}">${currentVal}</span> / ${dzikir.target}
                        </div>
                        
                        <button onclick="handleTap('${dzikir.id}', ${dzikir.target})" id="btn-count-${dzikir.id}" class="px-6 py-3 rounded-xl font-semibold flex items-center space-x-2 select-none shadow-sm transition-all duration-200 ${
                            isCompleted 
                            ? 'bg-emerald-500 text-white shadow-emerald-500/10' 
                            : 'bg-emerald-50 text-emerald-600 hover:bg-emerald-100 dark:bg-slate-700 dark:text-emerald-300 dark:hover:bg-slate-600'
                        }">
                            <span id="btn-icon-${dzikir.id}">
                                ${isCompleted 
                                    ? '<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" /></svg>' 
                                    : '<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>'
                                }
                            </span>
                            <span id="btn-text-${dzikir.id}">${isCompleted ? 'Selesai' : 'Ketuk'}</span>
                        </button>
                    </div>
                `;
                
                card.className = `bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800/80 p-5 md:p-6 transition-all duration-300 relative overflow-hidden flex flex-col ${
                    isCompleted ? 'border-emerald-200 dark:border-emerald-900/60 bg-emerald-50/20 dark:bg-emerald-950/10' : ''
                } ${isAudioPlaying ? 'active-audio-ring' : ''}`;
                card.innerHTML = html;
                dhikrListEl.appendChild(card);
            });
        }

        // Tap Counter Handler
        function handleTap(id, target) {
            if (!counts[id]) counts[id] = 0;
            
            if (counts[id] >= target) {
                counts[id] = 0;
                playClickSound();
            } else {
                counts[id]++;
                if (navigator.vibrate) {
                    navigator.vibrate(30);
                }
                
                if (counts[id] >= target) {
                    playSuccessSound();
                    if (navigator.vibrate) {
                        navigator.vibrate([60, 40, 60]);
                    }
                } else {
                    playClickSound();
                }
            }
            
            saveProgress();
            
            const cardEl = document.getElementById(`card-${id}`);
            const countValEl = document.getElementById(`count-val-${id}`);
            const btnEl = document.getElementById(`btn-count-${id}`);
            const btnIconEl = document.getElementById(`btn-icon-${id}`);
            const btnTextEl = document.getElementById(`btn-text-${id}`);
            
            const isCompleted = counts[id] >= target;
            countValEl.innerText = counts[id];
            
            if (isCompleted) {
                cardEl.classList.add('border-emerald-200', 'dark:border-emerald-900/60', 'bg-emerald-50/20', 'dark:bg-emerald-950/10');
                btnEl.className = "px-6 py-3 rounded-xl font-semibold flex items-center space-x-2 select-none shadow-sm transition-all duration-200 bg-emerald-500 text-white shadow-emerald-500/10";
                btnIconEl.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" /></svg>';
                btnTextEl.innerText = 'Selesai';
                
                if (settings.autoScroll) {
                    setTimeout(() => {
                        const data = getActiveData();
                        const nextIncomplete = data.find(item => (counts[item.id] || 0) < item.target);
                        if (nextIncomplete) {
                            const nextCard = document.getElementById(`card-${nextIncomplete.id}`);
                            if (nextCard) {
                                const offset = 100;
                                const bodyRect = document.body.getBoundingClientRect().top;
                                const elementRect = nextCard.getBoundingClientRect().top;
                                const elementPosition = elementRect - bodyRect;
                                const offsetPosition = elementPosition - offset;
                                
                                window.scrollTo({
                                    top: offsetPosition,
                                    behavior: 'smooth'
                                });
                            }
                        }
                    }, 400);
                }
            } else {
                cardEl.classList.remove('border-emerald-200', 'dark:border-emerald-900/60', 'bg-emerald-50/20', 'dark:bg-emerald-950/10');
                btnEl.className = "px-6 py-3 rounded-xl font-semibold flex items-center space-x-2 select-none shadow-sm transition-all duration-200 bg-emerald-50 text-emerald-600 hover:bg-emerald-100 dark:bg-slate-700 dark:text-emerald-300 dark:hover:bg-slate-600";
                btnIconEl.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>';
                btnTextEl.innerText = 'Ketuk';
            }
            
            updateProgressBar();
        }

        // AUDIO PLAYER ENGINE
        function setupAudioEngine() {
            // Audio Event Listeners to sync UI
            globalAudioPlayer.addEventListener('play', () => {
                updateAudioUI(currentPlayingId, true);
            });
            globalAudioPlayer.addEventListener('pause', () => {
                updateAudioUI(currentPlayingId, false);
            });
            globalAudioPlayer.addEventListener('ended', () => {
                updateAudioUI(currentPlayingId, false);
                currentPlayingId = null;
            });
            globalAudioPlayer.addEventListener('error', () => {
                console.log(`Audio error on current file. Triggering fallback streaming.`);
                // If local file failed, try online fallback
                const data = getActiveData();
                const currentItem = data.find(item => item.id === currentPlayingId);
                if (currentItem && globalAudioPlayer.src.includes('audio/')) {
                    // Switch to online url
                    globalAudioPlayer.src = currentItem.audio;
                    globalAudioPlayer.play().catch(e => {
                        console.error("Online audio fallback also failed or blocked.", e);
                        updateAudioUI(currentPlayingId, false);
                        currentPlayingId = null;
                    });
                } else {
                    updateAudioUI(currentPlayingId, false);
                    currentPlayingId = null;
                }
            });
        }

        function handleAudioPlay(id, onlineUrl) {
            if (!onlineUrl) return;

            // Context Audio unlock
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (currentPlayingId === id) {
                // If same audio clicked
                if (globalAudioPlayer.paused) {
                    globalAudioPlayer.play().catch(e => console.log("Play failed", e));
                } else {
                    globalAudioPlayer.pause();
                }
            } else {
                // If a new audio card clicked
                if (currentPlayingId) {
                    // Turn off old playing card UI
                    updateAudioUI(currentPlayingId, false);
                }
                
                currentPlayingId = id;
                
                // Set path: Try local offline file first (audio/pagi-1.mp3)
                // If local file doesn't exist, it will trigger error event and fall back to onlineUrl
                globalAudioPlayer.src = `audio/${id}.mp3`;
                globalAudioPlayer.load();
                
                globalAudioPlayer.play().catch(e => {
                    // Direct play failed (e.g. file not found or browser blocked it).
                    // Trigger load from online fallback directly
                    console.log("Local file load failed or blocked, loading online fallback.");
                    globalAudioPlayer.src = onlineUrl;
                    globalAudioPlayer.load();
                    globalAudioPlayer.play().catch(err => {
                        alert("Gagal memutar audio. Pastikan Anda terhubung ke internet jika file audio offline tidak diunduh.");
                        currentPlayingId = null;
                    });
                });
            }
        }

        function stopAudio() {
            if (!globalAudioPlayer.paused) {
                globalAudioPlayer.pause();
            }
            if (currentPlayingId) {
                updateAudioUI(currentPlayingId, false);
                currentPlayingId = null;
            }
        }

        function updateAudioUI(id, isPlaying) {
            if (!id) return;
            
            const cardEl = document.getElementById(`card-${id}`);
            const btnIconEl = document.getElementById(`audio-btn-icon-${id}`);
            
            if (cardEl) {
                if (isPlaying) {
                    cardEl.classList.add('active-audio-ring');
                } else {
                    cardEl.classList.remove('active-audio-ring');
                }
            }
            
            if (btnIconEl) {
                if (isPlaying) {
                    btnIconEl.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-emerald-500" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" /></svg>';
                } else {
                    btnIconEl.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>';
                }
            }
        }

        // Update top sticky progress bar
        function updateProgressBar() {
            const data = getActiveData();
            const total = data.length;
            let completed = 0;
            
            data.forEach(dzikir => {
                if ((counts[dzikir.id] || 0) >= dzikir.target) {
                    completed++;
                }
            });
            
            const percent = total > 0 ? Math.round((completed / total) * 100) : 0;
            
            progressBar.style.width = `${percent}%`;
            progressText.innerText = `Progres: ${completed}/${total} selesai`;
            progressPercent.innerText = `${percent}%`;
        }

        // Local Storage state management
        function saveProgress() {
            localStorage.setItem('dzikir_counts', JSON.stringify(counts));
        }

        function loadProgress() {
            const saved = localStorage.getItem('dzikir_counts');
            if (saved) {
                try {
                    counts = JSON.parse(saved);
                } catch (e) {
                    counts = {};
                }
            }
        }

        function saveSettings() {
            localStorage.setItem('dzikir_settings', JSON.stringify(settings));
            applySettings();
        }

        function loadSettings() {
            const saved = localStorage.getItem('dzikir_settings');
            if (saved) {
                try {
                    settings = {...settings, ...JSON.parse(saved)};
                } catch (e) {}
            }
            
            inputFontSize.value = settings.fontSize;
            fontSizeLabel.innerText = `${settings.fontSize}px`;
            
            toggleLatin.checked = settings.showLatin;
            toggleTranslation.checked = settings.showTranslation;
            toggleBenefit.checked = settings.showBenefit;
            toggleAutoScroll.checked = settings.autoScroll;
            
            applySettings();
        }

        function applySettings() {
            if (settings.darkMode) {
                document.documentElement.classList.add('dark');
                themeIconText.innerText = "🌙 Gelap";
            } else {
                document.documentElement.classList.remove('dark');
                themeIconText.innerText = "☀️ Terang";
            }
            
            document.querySelectorAll('.arabic-text').forEach(el => {
                el.style.fontSize = `${settings.fontSize}px`;
            });
            
            document.querySelectorAll('.latin-text').forEach(el => {
                if (settings.showLatin) el.classList.remove('hidden');
                else el.classList.add('hidden');
            });
            
            document.querySelectorAll('.translation-text').forEach(el => {
                if (settings.showTranslation) el.classList.remove('hidden');
                else el.classList.add('hidden');
            });

            document.querySelectorAll('.benefit-box').forEach(el => {
                if (settings.showBenefit) el.classList.remove('hidden');
                else el.classList.add('hidden');
            });
        }

        // Reset all counts
        function resetAllCounts() {
            if (confirm("Apakah Anda yakin ingin mengulang semua hitungan dari awal?")) {
                const data = getActiveData();
                data.forEach(dzikir => {
                    counts[dzikir.id] = 0;
                });
                saveProgress();
                renderDhikrList();
                updateProgressBar();
                
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            }
        }

        // Setup Event Listeners
        function setupEventListeners() {
            tabPagiBtn.addEventListener('click', () => switchTab('pagi'));
            tabPetangBtn.addEventListener('click', () => switchTab('petang'));
            
            btnReset.addEventListener('click', resetAllCounts);
            
            btnSound.addEventListener('click', () => {
                isSoundEnabled = !isSoundEnabled;
                if (isSoundEnabled) {
                    soundIconOn.classList.remove('hidden');
                    soundIconOff.classList.add('hidden');
                    playClickSound();
                } else {
                    soundIconOn.classList.add('hidden');
                    soundIconOff.classList.remove('hidden');
                }
            });
            
            btnSettings.addEventListener('click', () => {
                settingsDrawer.classList.remove('hidden');
                setTimeout(() => {
                    settingsContent.classList.remove('translate-y-full');
                }, 10);
            });
            
            const closeDrawer = () => {
                settingsContent.classList.add('translate-y-full');
                setTimeout(() => {
                    settingsDrawer.classList.add('hidden');
                }, 300);
            };
            
            btnCloseSettings.addEventListener('click', closeDrawer);
            settingsDrawer.addEventListener('click', (e) => {
                if (e.target === settingsDrawer) closeDrawer();
            });
            
            btnThemeToggle.addEventListener('click', () => {
                settings.darkMode = !settings.darkMode;
                saveSettings();
            });
            
            inputFontSize.addEventListener('input', (e) => {
                settings.fontSize = parseInt(e.target.value);
                fontSizeLabel.innerText = `${settings.fontSize}px`;
                applySettings();
            });
            
            inputFontSize.addEventListener('change', () => {
                saveSettings();
            });
            
            toggleLatin.addEventListener('change', (e) => {
                settings.showLatin = e.target.checked;
                saveSettings();
            });
            
            toggleTranslation.addEventListener('change', (e) => {
                settings.showTranslation = e.target.checked;
                saveSettings();
            });

            toggleBenefit.addEventListener('change', (e) => {
                settings.showBenefit = e.target.checked;
                saveSettings();
            });

            toggleAutoScroll.addEventListener('change', (e) => {
                settings.autoScroll = e.target.checked;
                saveSettings();
            });
        }
    </script>

    <!-- REGISTER SERVICE WORKER FOR PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then((reg) => {
                        console.log('PWA Service Worker registered successfully, scope:', reg.scope);
                    })
                    .catch((err) => {
                        console.error('PWA Service Worker registration failed:', err);
                    });
            });
        }
    </script>
